[project]
name = "photon-platform-clerk"
dynamic = ["version"]
authors = [
  { name="phi ARCHITECT", email="github@phiarchitect.com" },
]
description = "the ultimate assistant"
readme = "README.rst"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual",
    "rich",
    "jinja2",
    "click",
    "requests",
    "beautifulsoup4",
    "python-slugify",
    "pyyaml",
    "GitPython",
    "PyGithub",
    "toml",
    "arxiv",
    "graphviz",
]

[project.scripts]
clerk = "photon_platform.clerk.__main__:cli"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["photon_platform"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "photon_platform.clerk.__version__"}

[project.urls]
"Website" = "https://photon-platform.github.io/clerk"
"Repository" = "https://github.com/photon-platform/clerk"
"Issues" = "https://github.com/photon-platform/clerk/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"


